spring:
  application:
    name: sentinel-hsm-gateway
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sentinel}
    username: ${DB_USER:sentinel}
    password: ${DB_PASS:sentinel}
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

# Authentication uses the gateway's own session tokens (isc_sam_session) via
# SessionTokenAuthFilter — no external OAuth issuer. The secured profile is the
# default; dev-mode (auth disabled) is opt-in and localhost-only.

server:
  port: ${SERVER_PORT:8080}
  # Transport security. TLS is the primary protection for the exposed crypto API
  # (encrypts bodies, JWT bearer tokens, and all headers, and authenticates the
  # server). The JWE body-encryption layer is defense-in-depth ONLY and must not
  # be relied on as transport security. Enable TLS for every non-local deployment.
  ssl:
    enabled: ${TLS_ENABLED:false}
    key-store: ${TLS_KEYSTORE:/app/certs/sentinel-gateway.p12}
    key-store-password: ${TLS_KEYSTORE_PASSWORD:}
    key-store-type: ${TLS_KEYSTORE_TYPE:PKCS12}
    key-alias: ${TLS_KEY_ALIAS:sentinel-gateway}
    # Restrict to modern protocols. TLS 1.2 floor, 1.3 preferred.
    enabled-protocols: ${TLS_PROTOCOLS:TLSv1.3,TLSv1.2}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized

sentinel:
  thales:
    header: "0000"
    connect-timeout-ms: 60000
    read-timeout-ms: 60000
    pool-max-per-node: 8

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.isc.sentinel: INFO
