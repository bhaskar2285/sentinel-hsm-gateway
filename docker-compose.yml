services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    ports:
      - "5434:5432"
    volumes:
      - sentinel-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    build: .
    container_name: sentinel-hsm-gateway
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL:  jdbc:postgresql://127.0.0.1:5434/sentinel
      DB_USER: sentinel
      DB_PASS: sentinel
      SERVER_PORT: 8090
      OAUTH_ISSUER: ${OAUTH_ISSUER:-}
      # dev-mode disables auth entirely and is localhost-only. Secured target is
      # SPRING_PROFILES_ACTIVE=prod (session-token auth filter). Default stays dev
      # until the secured profile is deployed + verified.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # TLS termination (primary transport security). Enable for any non-local
      # deployment. Generate the keystore with scripts/gen-tls-keystore.sh.
      TLS_ENABLED: ${TLS_ENABLED:-false}
      TLS_KEYSTORE: ${TLS_KEYSTORE:-/app/certs/sentinel-gateway.p12}
      TLS_KEYSTORE_PASSWORD: ${TLS_KEYSTORE_PASSWORD:-}
      TLS_KEY_ALIAS: ${TLS_KEY_ALIAS:-sentinel-gateway}
    volumes:
      - ./certs:/app/certs:ro      # TLS keystore (read-only)
      - sentinel-jwe:/app/jwe       # persisted JWE key (survives restarts)
    network_mode: host
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # Reference: existing thales-go-sim instances are run elsewhere (thales-artemis-lb compose).
  # Point this gateway at them via hsm_node table rows pointing to host.docker.internal:<sim-port>.

volumes:
  sentinel-pg-data:
  sentinel-jwe:
